function loadState(){try{const saved=localStorage.getItem(STORE_KEY);if(saved){const s=JSON.parse(saved);s.products=s.products||SEED_PRODUCTS.map(p=>({...p,historico:[]}));s.procedures=s.procedures||[];s.clients=s.clients||[];s.appointments=s.appointments||[];s.version=2;return s}const old=localStorage.getItem('studioGestaoAmandaV1');if(old){const s=JSON.parse(old);s.clients=s.clients||[];s.appointments=s.appointments||[];s.version=2;return s}}catch(e){}return freshState()}

const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const n=v=>Number(v||0).toLocaleString('pt-BR');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function slug(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function parsedValidity(p){
  const txt=(p.validade||p.validadeOriginal||'').toLowerCase();
  if(p.validade && /^\d{4}-\d{2}-\d{2}$/.test(p.validade)){const d=new Date(p.validade+'T12:00:00');return {date:d,label:d.toLocaleDateString('pt-BR'),precision:'dia'}}
  let m=txt.match(/(0?[1-9]|1[0-2])\/(\d{2})(?!\d)/);if(m){let year=2000+Number(m[2]);let month=Number(m[1]);let d=new Date(year,month,0,12);return {date:d,label:String(month).padStart(2,'0')+'/'+m[2],precision:'mês'}}
  m=txt.match(/(\d{1,2})\/(\d{1,2})(?!\/\d)/);if(m){return {date:null,label:String(m[1]).padStart(2,'0')+'/'+String(m[2]).padStart(2,'0'),precision:'sem_ano'}}
  return {date:null,label:'Sem validade',precision:'none'}
}
function validityStatus(p){const x=parsedValidity(p);if(!x.date)return x.precision==='sem_ano'?{key:'unknownYear',label:'Ano não informado',class:'muted'}:{key:'none',label:'Sem validade',class:'muted'};const days=Math.ceil((x.date-TODAY)/86400000);if(days<=30)return {key:'red',label:days<0?'Vencido':'Até 30 dias',class:'danger'};if(days<=60)return {key:'orange',label:'31–60 dias',class:'orange'};if(days<=90)return {key:'yellow',label:'61–90 dias',class:'warn'};return {key:'green',label:'Mais de 90 dias',class:'ok'} }
function stockStatus(p){if(p.estoqueAtual===null||p.estoqueMinimo===null||p.estoqueAtual===''||p.estoqueMinimo==='')return {label:'A preencher',class:'muted'};return Number(p.estoqueAtual)<=Number(p.estoqueMinimo)?{label:'Reposição necessária',class:'danger'}:{label:'Estoque OK',class:'ok'}}
function categories(){return [...new Set(state.products.map(p=>p.categoria))]}
function monthAppointments(){const y=TODAY.getFullYear(),m=TODAY.getMonth();return state.appointments.filter(a=>{const d=new Date((a.data||'')+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m})}
function procedureCost(pr){return (pr?.items||[]).reduce((a,it)=>{const p=state.products.find(x=>x.id===Number(it.productId));return a+(p?Number(p.custoUso||0)*Number(it.qty||1):0)},0)}
function totals(){const total=state.products.reduce((a,p)=>a+Number(p.precoCompra||0),0);const low=state.products.filter(p=>stockStatus(p).class==='danger').length;const exp=state.products.filter(p=>['danger','orange','warn'].includes(validityStatus(p).class)).length;const ap=monthAppointments();const faturamento=ap.reduce((a,x)=>a+Number(x.valor||0),0);const custo=ap.reduce((a,x)=>a+Number(x.custo||0),0);return {total,low,exp,faturamento,atendimentos:ap.length,ticket:ap.length?faturamento/ap.length:0,margem:faturamento?((faturamento-custo)/faturamento*100):0}}
function renderNav(){document.getElementById('desktopNav').innerHTML=navItems.map(([id,ico,label])=>`<button class="${route===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('');document.getElementById('mobileNav').innerHTML=mobileItems.map(([id,ico,label])=>`<button class="${route===id || (id==='mais' && ['procedimentos','financeiro','config','validades'].includes(route))?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')}

${kpi('Valor dos produtos cadastrados',brl(t.total),'Base real da planilha')}${kpi('Produtos cadastrados',n(state.products.length),'Fonte inicial oficial')}${kpi('Produtos para reposição',n(t.low),'Após preencher estoque e mínimo')}${kpi('Próximos do vencimento',n(t.exp),'Inclui até 90 dias')}${kpi('Faturamento do mês',brl(t.faturamento),'Atendimentos registrados')}${kpi('Atendimentos do mês',n(t.atendimentos),'Nesta versão local')}${kpi('Ticket médio',brl(t.ticket),'Faturamento ÷ atendimentos')}${kpi('Margem estimada',t.margem.toFixed(1)+'%','Antes das despesas operacionais')}</div>
<div class="grid section-grid"><div class="card"><div class="card-header"><div><h2>Valor de produtos por categoria</h2><div class="subtle">Total cadastrado por categoria</div></div><strong>${brl(t.total)}</strong></div><div class="bars">${cat.map(x=>`<div class="bar-row"><span>${esc(x.c)}</span><div class="bar-track"><div class="bar-fill" style="width:${(x.value/maxV*100).toFixed(1)}%"></div></div><strong>${brl(x.value)}</strong></div>`).join('')}</div></div>
<div class="card"><div class="card-header"><div><h2>Produtos por categoria</h2><div class="subtle">Distribuição dos 94 itens</div></div></div><div class="bars">${cat.map(x=>`<div class="bar-row"><span>${esc(x.c)}</span><div class="bar-track"><div class="bar-fill" style="width:${x.count/Math.max(...cat.map(a=>a.count))*100}%"></div></div><strong>${x.count}</strong></div>`).join('')}</div></div></div>

function kpi(label,value,hint){return `<div class="kpi"><span class="label">${label}</span><strong>${value}</strong><div class="hint">${hint}</div></div>`}
function validityAttention(){const items=state.products.filter(p=>parsedValidity(p).precision!=='none').slice(0,8);return `<div class="ranking">${items.map(p=>{const st=validityStatus(p),x=parsedValidity(p);return `<div class="rank-row"><span class="rank-num">•</span><div><strong>${esc(p.produto)}</strong><small>${esc(p.validadeOriginal||'Validade cadastrada')}</small></div><span class="badge ${st.class}">${x.label}</span></div>`}).join('')}</div>`}
function stockView(){return `<div class="card"><div class="card-header"><div><h2>Produtos e estoque</h2><div class="subtle">94 produtos importados; campos novos ficam vazios até serem preenchidos.</div></div><button class="btn btn-primary" onclick="openProductForm()">+ Novo produto</button></div><div class="toolbar"><input class="input" id="stockSearch" placeholder="Buscar produto, marca ou fornecedor"><select class="select" id="catFilter"><option value="">Todas as categorias</option>${categories().map(c=>`<option>${esc(c)}</option>`).join('')}</select><select class="select" id="stockFilter"><option value="">Todos os status</option><option value="low">Estoque baixo</option><option value="validity">Próximo do vencimento</option><option value="expired">Vencido</option><option value="none">Sem validade</option></select><button class="btn btn-soft" onclick="exportProducts()">Exportar CSV</button></div><div id="stockTable">${stockTable(state.products)}</div></div>`}
function stockTable(products){return `<div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Compra</th><th>Rendimento</th><th>Custo/uso</th><th>Estoque</th><th>Validade</th><th>Status</th><th></th></tr></thead><tbody>${products.map(p=>{const st=stockStatus(p),vs=validityStatus(p),pv=parsedValidity(p);return `<tr><td>${esc(p.produto)}</td><td>${esc(p.categoria)}</td><td>${brl(p.precoCompra)}</td><td>${n(p.rendimento)}</td><td>${brl(p.custoUso)}</td><td>${p.estoqueAtual===null?'—':esc(p.estoqueAtual)}</td><td><span class="badge ${vs.class}">${esc(pv.label)}</span></td><td><span class="badge ${st.class}">${st.label}</span></td><td><div class="product-actions"><button class="icon-btn" title="Abrir ficha" onclick="openProduct(${p.id})">↗</button><button class="icon-btn" title="Entrada" onclick="moveStock(${p.id},'entrada')">＋</button><button class="icon-btn" title="Utilização" onclick="moveStock(${p.id},'uso')">−</button></div></td></tr>`}).join('')}</tbody></table></div>${products.length?'':`<div class="empty"><strong>Nenhum produto encontrado</strong>Ajuste os filtros de busca.</div>`}`}
function validityView(){const counts={red:0,orange:0,yellow:0,green:0,none:0};state.products.forEach(p=>{const k=validityStatus(p).key;if(counts[k]!==undefined)counts[k]++});return `<div class="validity-grid">${[['red','Vencidos / até 30 dias'],['orange','31–60 dias'],['yellow','61–90 dias'],['green','Mais de 90 dias'],['none','Sem validade']].map(([k,l])=>`<div class="status-card"><strong>${counts[k]}</strong><span>${l}</span></div>`).join('')}</div><div class="card"><div class="card-header"><div><h2>Controle de validade</h2><div class="subtle">Registros “18/10” e “30/10” permanecem sem ano, conforme a fonte.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Informação original</th><th>Validade interpretada</th><th>Classificação</th><th></th></tr></thead><tbody>${state.products.filter(p=>parsedValidity(p).precision!=='none').map(p=>{const x=parsedValidity(p),s=validityStatus(p);return `<tr><td>${esc(p.produto)}</td><td>${esc(p.categoria)}</td><td>${esc(p.validadeOriginal)}</td><td>${esc(x.label)}</td><td><span class="badge ${s.class}">${s.label}</span></td><td><button class="btn btn-ghost" onclick="editValidity(${p.id})">Editar</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function proceduresView(){return `<div class="card"><div class="card-header"><div><h2>Procedimentos</h2><div class="subtle">Monte a composição com produtos reais e calcule custo e margem automaticamente.</div></div><button class="btn btn-primary" onclick="openProcedureForm()">+ Cadastrar procedimento</button></div>${state.procedures.length?`<div class="procedure-list">${state.procedures.map(p=>procedureCard(p)).join('')}</div>`:`<div class="empty"><strong>Nenhum procedimento cadastrado</strong>Cadastre o primeiro procedimento e selecione os produtos utilizados.</div>`}</div>`}
function procedureCard(pr){const custo=pr.items.reduce((a,it)=>{const p=state.products.find(x=>x.id===it.productId);return a+(p?Number(p.custoUso||0)*Number(it.qty||1):0)},0),m=Number(pr.price||0)-custo,pct=Number(pr.price)?m/Number(pr.price)*100:0;return `<div class="procedure-card"><h3>${esc(pr.name)}</h3><div class="procedure-meta"><div class="metric-mini"><span>Preço</span><strong>${brl(pr.price)}</strong></div><div class="metric-mini"><span>Custo produtos</span><strong>${brl(custo)}</strong></div><div class="metric-mini"><span>Margem</span><strong>${brl(m)}</strong></div><div class="metric-mini"><span>Margem %</span><strong>${pct.toFixed(1)}%</strong></div></div><div style="margin-top:12px"><button class="btn btn-ghost" onclick="openProcedureForm(${pr.id})">Editar</button></div></div>`}

function fmtDate(v){if(!v)return '—';const d=new Date(v+'T12:00:00');return isNaN(d)?v:d.toLocaleDateString('pt-BR')}

function clientStats(c){const ap=clientAppointments(c.id),total=ap.reduce((a,x)=>a+Number(x.valor||0),0);return {count:ap.length,total,ticket:ap.length?total/ap.length:0,last:ap[0]||null}}
function clientsView(){const clients=[...state.clients].sort((a,b)=>a.nome.localeCompare(b.nome));return `<div class="card"><div class="card-header"><div><h2>Clientes</h2><div class="subtle">Cadastro simples, histórico de atendimentos e retorno.</div></div><button class="btn btn-primary" onclick="openClientForm()">+ Novo cliente</button></div><div class="toolbar"><input class="input" id="clientSearch" placeholder="Buscar por nome, telefone ou WhatsApp"></div><div id="clientTable">${clientsTable(clients)}</div></div>`}
function clientsTable(clients){return clients.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Contato</th><th>Última visita</th><th>Atendimentos</th><th>Total gasto</th><th>Próximo retorno</th><th></th></tr></thead><tbody>${clients.map(c=>{const st=clientStats(c);return `<tr><td>${esc(c.nome)}</td><td>${esc(c.whatsapp||c.telefone||'—')}</td><td>${st.last?fmtDate(st.last.data):'—'}</td><td>${st.count}</td><td>${brl(st.total)}</td><td>${fmtDate(c.proximoRetorno)}</td><td><button class="icon-btn" onclick="openClient(${c.id})">↗</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><strong>Nenhum cliente cadastrado</strong>Cadastre clientes manualmente ou durante um atendimento.</div>`}
function openClientForm(id){const c=id?state.clients.find(x=>x.id===id):{nome:'',telefone:'',whatsapp:'',nascimento:'',email:'',proximoRetorno:'',observacoes:''};openModal(`<h2>${id?'Editar cliente':'Novo cliente'}</h2><div class="form-grid" style="margin-top:16px">${field('Nome','clNome',c.nome,'text',true)}${field('Telefone','clTelefone',c.telefone)}${field('WhatsApp','clWhatsapp',c.whatsapp)}${field('Data de nascimento','clNasc',c.nascimento,'date')}${field('E-mail','clEmail',c.email,'email')}${field('Próximo retorno','clRetorno',c.proximoRetorno,'date')}<div class="field full"><label>Observações</label><textarea id="clObs">${esc(c.observacoes||'')}</textarea></div><div class="field full"><button class="btn btn-primary" onclick="saveClient(${id||'null'})">Salvar cliente</button></div></div>`)}
function saveClient(id){const payload={nome:document.getElementById('clNome').value.trim(),telefone:document.getElementById('clTelefone').value,whatsapp:document.getElementById('clWhatsapp').value,nascimento:document.getElementById('clNasc').value,email:document.getElementById('clEmail').value,proximoRetorno:document.getElementById('clRetorno').value,observacoes:document.getElementById('clObs').value};if(!payload.nome)return toast('Informe o nome do cliente');if(id)Object.assign(state.clients.find(x=>x.id===id),payload);else state.clients.push({...payload,id:Math.max(0,...state.clients.map(x=>x.id))+1,criadoEm:new Date().toISOString()});saveState();closeModal();render();toast('Cliente salvo')}
function openClient(id){const c=state.clients.find(x=>x.id===id),st=clientStats(c),last=st.last,pr=last?state.procedures.find(p=>p.id===last.procedureId):null;openModal(`<div class="card-header"><div><h2>${esc(c.nome)}</h2><div class="subtle">${esc(c.whatsapp||c.telefone||'Contato não informado')}</div></div><button class="btn btn-soft" onclick="openClientForm(${c.id})">Editar</button></div><div class="profile-metrics"><div class="metric-mini"><span>Última visita</span><strong>${last?fmtDate(last.data):'—'}</strong></div><div class="metric-mini"><span>Último procedimento</span><strong>${esc(pr?.name||last?.procedureName||'—')}</strong></div><div class="metric-mini"><span>Total de atendimentos</span><strong>${st.count}</strong></div><div class="metric-mini"><span>Total gasto</span><strong>${brl(st.total)}</strong></div><div class="metric-mini"><span>Ticket médio</span><strong>${brl(st.ticket)}</strong></div><div class="metric-mini"><span>Próximo retorno</span><strong>${fmtDate(c.proximoRetorno)}</strong></div></div><h3 style="margin-top:20px">Histórico</h3>${st.count?`<div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Data</th><th>Procedimento</th><th>Valor</th><th>Pagamento</th></tr></thead><tbody>${clientAppointments(c.id).map(a=>`<tr><td>${fmtDate(a.data)}</td><td>${esc(a.procedureName||'—')}</td><td>${brl(a.valor)}</td><td>${esc(a.pagamento)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ainda não há atendimentos.</div>'}`)}
function appointmentsView(){const ap=[...state.appointments].sort((a,b)=>((b.data||'')+(b.horario||'')).localeCompare((a.data||'')+(a.horario||'')));return `<div class="card"><div class="card-header"><div><h2>Atendimentos</h2><div class="subtle">Finalize um atendimento para atualizar cliente, estoque e financeiro.</div></div><button class="btn btn-primary" onclick="openAppointmentForm()">+ Registrar atendimento</button></div>${state.procedures.length?'':`<div class="note" style="margin-bottom:14px">Cadastre pelo menos um procedimento antes de registrar atendimentos.</div>`}${ap.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Cliente</th><th>Procedimento</th><th>Pagamento</th><th>Valor</th><th>Custo</th><th>Margem</th></tr></thead><tbody>${ap.map(a=>`<tr><td>${fmtDate(a.data)} ${esc(a.horario||'')}</td><td>${esc(a.clientName||'—')}</td><td>${esc(a.procedureName||'—')}</td><td>${esc(a.pagamento)}</td><td>${brl(a.valor)}</td><td>${brl(a.custo)}</td><td>${brl(Number(a.valor||0)-Number(a.custo||0))}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Nenhum atendimento registrado</strong>O financeiro começará a ser preenchido automaticamente aqui.</div>`}</div>`}
function openAppointmentForm(){if(!state.procedures.length){toast('Cadastre um procedimento primeiro');go('procedimentos');return}const today=TODAY.toISOString().slice(0,10);openModal(`<h2>Novo atendimento</h2><div class="form-grid" style="margin-top:16px"><div class="field full"><label>Cliente</label><select id="atClient"><option value="">Novo cliente / selecionar...</option>${state.clients.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div><div class="field full" id="newClientBox"><label>Nome do novo cliente</label><input id="atNewClient" placeholder="Preencha somente se for cliente novo"></div><div class="field full"><label>Procedimento</label><select id="atProcedure" onchange="syncAppointmentPrice()">${state.procedures.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>${field('Data','atDate',today,'date')}${field('Horário','atTime','','time')}${field('Valor','atValue',state.procedures[0]?.price||0,'number')}<div class="field"><label>Forma de pagamento</label><select id="atPay"><option>Pix</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Outro</option></select></div>${field('Profissional','atProf',state.settings.profissional||'')}<div class="field full"><label>Observação</label><textarea id="atObs"></textarea></div><div class="field full"><div id="atCalc" class="note"></div></div><div class="field full"><button class="btn btn-primary" onclick="saveAppointment()">Finalizar atendimento</button></div></div>`);syncAppointmentPrice(false);document.getElementById('atValue').addEventListener('input',appointmentCalc)}
function syncAppointmentPrice(setPrice=true){const pr=state.procedures.find(p=>p.id===Number(document.getElementById('atProcedure')?.value));if(setPrice&&pr)document.getElementById('atValue').value=pr.price||0;appointmentCalc()}
function appointmentCalc(){const pr=state.procedures.find(p=>p.id===Number(document.getElementById('atProcedure')?.value)),cost=procedureCost(pr),value=Number(document.getElementById('atValue')?.value||0),margin=value-cost,pct=value?margin/value*100:0,e=document.getElementById('atCalc');if(e)e.innerHTML=`Custo estimado dos produtos: <strong>${brl(cost)}</strong> · Margem: <strong>${brl(margin)}</strong> · <strong>${pct.toFixed(1)}%</strong>`}
function saveAppointment(){let clientId=Number(document.getElementById('atClient').value||0),client=state.clients.find(c=>c.id===clientId);if(!client){const name=document.getElementById('atNewClient').value.trim();if(!name)return toast('Selecione ou informe o cliente');client={id:Math.max(0,...state.clients.map(x=>x.id))+1,nome:name,telefone:'',whatsapp:'',nascimento:'',email:'',proximoRetorno:'',observacoes:'',criadoEm:new Date().toISOString()};state.clients.push(client);clientId=client.id}const pr=state.procedures.find(p=>p.id===Number(document.getElementById('atProcedure').value));const data=document.getElementById('atDate').value;if(!data)return toast('Informe a data');const cost=procedureCost(pr),appt={id:Math.max(0,...state.appointments.map(x=>x.id))+1,clientId,clientName:client.nome,procedureId:pr.id,procedureName:pr.name,data,horario:document.getElementById('atTime').value,valor:Number(document.getElementById('atValue').value||0),pagamento:document.getElementById('atPay').value,profissional:document.getElementById('atProf').value,observacao:document.getElementById('atObs').value,custo:cost,criadoEm:new Date().toISOString()};state.appointments.push(appt);(pr.items||[]).forEach(it=>{const p=state.products.find(x=>x.id===Number(it.productId)),qty=Number(it.qty||1);if(!p)return;p.historico=p.historico||[];p.historico.unshift({type:'utilizacao',qty,date:new Date().toISOString(),appointmentId:appt.id});if(p.estoqueAtual!==null&&p.estoqueAtual!=='')p.estoqueAtual=Math.max(0,Number(p.estoqueAtual)-qty);p.ultimaAtualizacao=new Date().toISOString()});saveState();closeModal();render();toast('Atendimento finalizado e financeiro atualizado')}
function financeView(){const ap=[...state.appointments],month=monthAppointments(),rev=month.reduce((a,x)=>a+Number(x.valor||0),0),cost=month.reduce((a,x)=>a+Number(x.custo||0),0),unique=new Set(month.map(x=>x.clientId)).size,newClients=state.clients.filter(c=>{const first=clientAppointments(c.id).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||''))[0];return first&&month.includes(first)}).length;const byProc={};month.forEach(a=>{const k=a.procedureName||'Sem procedimento';byProc[k]=(byProc[k]||0)+Number(a.valor||0)});const max=Math.max(1,...Object.values(byProc));return `<div class="grid kpi-grid">${kpi('Faturamento',brl(rev),'Mês atual')}${kpi('Atendimentos',month.length,'Mês atual')}${kpi('Ticket médio',brl(month.length?rev/month.length:0),'Por atendimento')}${kpi('Custo de produtos',brl(cost),'Composições dos procedimentos')}${kpi('Margem estimada',brl(rev-cost),'Antes das despesas')}${kpi('Margem percentual',rev?((rev-cost)/rev*100).toFixed(1)+'%':'0,0%','Contribuição estimada')}${kpi('Clientes atendidos',unique,'Clientes únicos no mês')}${kpi('Clientes novos',newClients,'Primeiro atendimento no mês')}</div><div class="grid section-grid"><div class="card"><div class="card-header"><div><h2>Faturamento por procedimento</h2><div class="subtle">Mês atual</div></div></div>${Object.keys(byProc).length?`<div class="bars">${Object.entries(byProc).sort((a,b)=>b[1]-a[1]).map(([name,v])=>`<div class="bar-row"><span>${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%"></div></div><strong>${brl(v)}</strong></div>`).join('')}</div>`:'<div class="empty">Os gráficos aparecerão após os primeiros atendimentos.</div>'}</div><div class="card"><div class="card-header"><div><h2>Formas de pagamento</h2><div class="subtle">Receita no mês</div></div></div>${paymentRanking(month)}</div></div><div class="card" style="margin-top:16px"><div class="card-header"><div><h2>Exportações</h2><div class="subtle">Dados salvos neste navegador</div></div></div><div class="toolbar"><button class="btn btn-soft" onclick="exportAppointments()">Exportar atendimentos</button><button class="btn btn-soft" onclick="exportClients()">Exportar clientes</button><button class="btn btn-soft" onclick="exportFinance()">Exportar financeiro</button></div></div>`}
function paymentRanking(ap){const o={};ap.forEach(a=>o[a.pagamento]=(o[a.pagamento]||0)+Number(a.valor||0));return Object.keys(o).length?`<div class="ranking">${Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<div class="rank-row"><span class="rank-num">${i+1}</span><div><strong>${esc(k)}</strong><small>Forma de pagamento</small></div><span class="money">${brl(v)}</span></div>`).join('')}</div>`:'<div class="empty">Sem recebimentos no mês.</div>'}
function exportCsv(name,h,rows){const blob=new Blob(['\ufeff'+[h,...rows].map(r=>r.map(csvCell).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);toast('CSV exportado')}
function exportAppointments(){exportCsv('studio_gestao_atendimentos.csv',['Data','Cliente','Procedimento','Valor','Pagamento','Profissional','Custo'],state.appointments.map(a=>[a.data,a.clientName,a.procedureName,a.valor,a.pagamento,a.profissional,a.custo]))}
function exportClients(){exportCsv('studio_gestao_clientes.csv',['Nome','Telefone','WhatsApp','Nascimento','E-mail','Próximo retorno'],state.clients.map(c=>[c.nome,c.telefone,c.whatsapp,c.nascimento,c.email,c.proximoRetorno]))}
function exportFinance(){exportCsv('studio_gestao_financeiro.csv',['Data','Receita','Custo de produtos','Margem','Pagamento','Procedimento'],state.appointments.map(a=>[a.data,a.valor,a.custo,Number(a.valor||0)-Number(a.custo||0),a.pagamento,a.procedureName]))}
function futureView(r){const labels={atendimentos:'Atendimentos',clientes:'Clientes',financeiro:'Financeiro'};return `<div class="card"><div class="empty"><strong>${labels[r]}</strong>Estrutura preparada para a próxima etapa. A primeira versão prioriza Dashboard, Estoque, Validades e Procedimentos, conforme solicitado.</div></div>`}

function settingsView(){const s=state.settings;return `<div class="grid section-grid"><div class="card"><div class="card-header"><div><h2>Dados do Studio</h2><div class="subtle">Informações salvas localmente neste navegador.</div></div></div><div class="form-grid"><div class="field full"><label>Nome do Studio</label><input id="setStudio" value="${esc(s.studio)}"></div><div class="field"><label>Telefone</label><input id="setTelefone" value="${esc(s.telefone)}"></div><div class="field"><label>WhatsApp</label><input id="setWhatsapp" value="${esc(s.whatsapp)}"></div><div class="field"><label>Instagram</label><input id="setInstagram" value="${esc(s.instagram)}"></div><div class="field"><label>Nome da profissional</label><input id="setProf" value="${esc(s.profissional)}"></div><div class="field full"><label>Endereço</label><input id="setEndereco" value="${esc(s.endereco)}"></div><div class="field full"><button class="btn btn-primary" onclick="saveSettings()">Salvar dados do Studio</button></div></div></div><div class="card"><div class="card-header"><div><h2>Dados e exportação</h2><div class="subtle">A importação preserva clientes e atendimentos.</div></div></div><div class="note">A base inicial veio de <strong>transcricao_produtos_estetica.xlsx</strong>. Nesta entrega, a reimportação de Excel está preparada como próxima integração; exportação de produtos em CSV já funciona.</div><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn btn-soft" onclick="exportProducts()">Exportar produtos</button><button class="btn btn-ghost" onclick="resetProducts()">Restaurar produtos da planilha</button></div></div></div>`}
function bindView(){if(route==='clientes'){const q=document.getElementById('clientSearch');q?.addEventListener('input',()=>{const term=slug(q.value);document.getElementById('clientTable').innerHTML=clientsTable(state.clients.filter(c=>slug(c.nome+' '+c.telefone+' '+c.whatsapp).includes(term)))})}if(route==='estoque'){const s=document.getElementById('stockSearch'),c=document.getElementById('catFilter'),f=document.getElementById('stockFilter');[s,c,f].forEach(el=>el.addEventListener('input',filterStock));[c,f].forEach(el=>el.addEventListener('change',filterStock))}}
function filterStock(){const q=slug(document.getElementById('stockSearch').value),cat=document.getElementById('catFilter').value,flt=document.getElementById('stockFilter').value;let arr=state.products.filter(p=>(!q||slug([p.produto,p.marca,p.fornecedor].join(' ')).includes(q))&&(!cat||p.categoria===cat));if(flt==='low')arr=arr.filter(p=>stockStatus(p).class==='danger');if(flt==='validity')arr=arr.filter(p=>['danger','orange','warn'].includes(validityStatus(p).class));if(flt==='expired')arr=arr.filter(p=>validityStatus(p).label==='Vencido');if(flt==='none')arr=arr.filter(p=>parsedValidity(p).precision==='none');document.getElementById('stockTable').innerHTML=stockTable(arr)}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}

function openProduct(id){const p=state.products.find(x=>x.id===id),x=parsedValidity(p),vs=validityStatus(p),ss=stockStatus(p);openModal(`<h2>${esc(p.produto)}</h2><p class="subtle">${esc(p.categoria)}</p><div class="grid kpi-grid" style="margin:18px 0"><div class="metric-mini"><span>Preço de compra</span><strong>${brl(p.precoCompra)}</strong></div><div class="metric-mini"><span>Rendimento</span><strong>${n(p.rendimento)}</strong></div><div class="metric-mini"><span>Custo por aplicação</span><strong>${brl(p.custoUso)}</strong></div><div class="metric-mini"><span>Validade</span><strong>${esc(x.label)}</strong></div></div><div class="note">${esc(p.observacoes||'Sem observações na planilha.')}</div><p><span class="badge ${ss.class}">${ss.label}</span> <span class="badge ${vs.class}">${vs.label}</span></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="moveStock(${p.id},'entrada')">Entrada</button><button class="btn btn-soft" onclick="moveStock(${p.id},'uso')">Utilização</button><button class="btn btn-ghost" onclick="openProductForm(${p.id})">Editar</button></div>`)}
function openProductForm(id){const p=id?state.products.find(x=>x.id===id):{id:null,categoria:categories()[0]||'',produto:'',marca:'',fornecedor:'',precoCompra:'',quantidadeAdquirida:'',unidade:'',rendimento:'',custoUso:'',estoqueAtual:'',estoqueMinimo:'',dataCompra:'',validade:'',lote:'',observacoes:''};openModal(`<h2>${id?'Editar produto':'Novo produto'}</h2><div class="form-grid" style="margin-top:18px">${field('Produto','pfProduto',p.produto,'text',true)}<div class="field"><label>Categoria</label><select id="pfCategoria">${categories().map(c=>`<option ${c===p.categoria?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${field('Marca','pfMarca',p.marca)}${field('Fornecedor','pfFornecedor',p.fornecedor)}${field('Preço de compra','pfPreco',p.precoCompra,'number')}${field('Rendimento','pfRendimento',p.rendimento,'number')}${field('Custo por utilização','pfCusto',p.custoUso,'number')}${field('Estoque atual','pfEstoque',p.estoqueAtual??'','number')}${field('Estoque mínimo','pfMin',p.estoqueMinimo??'','number')}${field('Data de validade','pfValidade',p.validade||'','date')}${field('Lote','pfLote',p.lote)}<div class="field full"><label>Observações</label><textarea id="pfObs">${esc(p.observacoes)}</textarea></div><div class="field full"><button class="btn btn-primary" onclick="saveProduct(${id||'null'})">Salvar produto</button></div></div>`)}
function field(label,id,val,type='text',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><input id="${id}" type="${type}" ${type==='number'?'step="0.01"':''} value="${esc(val)}"></div>`}
function saveProduct(id){const payload={categoria:document.getElementById('pfCategoria').value,produto:document.getElementById('pfProduto').value.trim(),marca:document.getElementById('pfMarca').value,fornecedor:document.getElementById('pfFornecedor').value,precoCompra:Number(document.getElementById('pfPreco').value||0),rendimento:Number(document.getElementById('pfRendimento').value||0),custoUso:Number(document.getElementById('pfCusto').value||0),estoqueAtual:document.getElementById('pfEstoque').value===''?null:Number(document.getElementById('pfEstoque').value),estoqueMinimo:document.getElementById('pfMin').value===''?null:Number(document.getElementById('pfMin').value),validade:document.getElementById('pfValidade').value,lote:document.getElementById('pfLote').value,observacoes:document.getElementById('pfObs').value,ultimaAtualizacao:new Date().toISOString()};if(!payload.produto){toast('Informe o nome do produto');return}if(id){Object.assign(state.products.find(x=>x.id===id),payload)}else{state.products.push({...payload,id:Math.max(0,...state.products.map(x=>x.id))+1,validadeOriginal:'',historico:[],quantidadeAdquirida:null,unidade:'',dataCompra:'',status:''})}saveState();closeModal();render();toast('Produto salvo')}
function moveStock(id,type){const p=state.products.find(x=>x.id===id);openModal(`<h2>${type==='entrada'?'Entrada de produto':'Registrar utilização'}</h2><p>${esc(p.produto)}</p><div class="field"><label>Quantidade</label><input id="movQty" type="number" min="0.01" step="0.01" value="1"></div><div style="margin-top:14px"><button class="btn btn-primary" onclick="saveMovement(${id},'${type}')">Confirmar</button></div>`)}
function saveMovement(id,type){const p=state.products.find(x=>x.id===id),qty=Number(document.getElementById('movQty').value||0);if(qty<=0)return;p.estoqueAtual=Number(p.estoqueAtual||0)+(type==='entrada'?qty:-qty);p.historico=p.historico||[];p.historico.unshift({type,qty,date:new Date().toISOString()});p.ultimaAtualizacao=new Date().toISOString();saveState();closeModal();render();toast(type==='entrada'?'Entrada registrada':'Utilização registrada')}
function editValidity(id){const p=state.products.find(x=>x.id===id);openModal(`<h2>Editar validade</h2><p>${esc(p.produto)}</p><div class="field"><label>Data de validade</label><input id="valDate" type="date" value="${esc(p.validade||'')}"></div><div class="note" style="margin-top:12px">Informação original: ${esc(p.validadeOriginal||'não informada')}</div><div style="margin-top:14px"><button class="btn btn-primary" onclick="saveValidity(${id})">Salvar validade</button></div>`)}
function saveValidity(id){state.products.find(x=>x.id===id).validade=document.getElementById('valDate').value;saveState();closeModal();render();toast('Validade atualizada')}
function openProcedureForm(id){const pr=id?state.procedures.find(x=>x.id===id):{id:null,name:'',price:'',items:[]};openModal(`<h2>${id?'Editar procedimento':'Cadastrar procedimento'}</h2><div class="form-grid" style="margin-top:16px">${field('Nome','procName',pr.name,'text',true)}${field('Preço cobrado','procPrice',pr.price,'number')}<div class="field full"><label>Produtos utilizados</label><div id="procItems"></div><button class="btn btn-soft" style="margin-top:8px" onclick="addProcItem()">+ Adicionar produto</button></div><div class="field full"><div id="procCalc" class="note"></div></div><div class="field full"><button class="btn btn-primary" onclick="saveProcedure(${id||'null'})">Salvar procedimento</button></div></div>`);window._procDraft=JSON.parse(JSON.stringify(pr.items||[]));renderProcItems();document.getElementById('procPrice').addEventListener('input',calcProc)}
function addProcItem(){window._procDraft.push({productId:state.products[0].id,qty:1});renderProcItems()}
function renderProcItems(){const c=document.getElementById('procItems');c.innerHTML=window._procDraft.map((it,i)=>`<div style="display:grid;grid-template-columns:1fr 80px 34px;gap:6px;margin:6px 0"><select onchange="updProc(${i},'productId',this.value)">${state.products.map(p=>`<option value="${p.id}" ${p.id===Number(it.productId)?'selected':''}>${esc(p.produto)} · ${brl(p.custoUso)}</option>`).join('')}</select><input type="number" min="0.1" step="0.1" value="${it.qty}" onchange="updProc(${i},'qty',this.value)"><button class="icon-btn" onclick="delProc(${i})">×</button></div>`).join('');calcProc()}
function updProc(i,k,v){window._procDraft[i][k]=k==='productId'?Number(v):Number(v);calcProc()}function delProc(i){window._procDraft.splice(i,1);renderProcItems()}
function calcProc(){const cost=window._procDraft.reduce((a,it)=>{const p=state.products.find(x=>x.id===Number(it.productId));return a+(p?Number(p.custoUso||0)*Number(it.qty||1):0)},0),price=Number(document.getElementById('procPrice')?.value||0),m=price-cost,pct=price?m/price*100:0;const e=document.getElementById('procCalc');if(e)e.innerHTML=`Custo de produtos: <strong>${brl(cost)}</strong> · Margem: <strong>${brl(m)}</strong> · Margem percentual: <strong>${pct.toFixed(1)}%</strong>`}
function saveProcedure(id){const name=document.getElementById('procName').value.trim(),price=Number(document.getElementById('procPrice').value||0);if(!name){toast('Informe o nome do procedimento');return}if(id){Object.assign(state.procedures.find(x=>x.id===id),{name,price,items:window._procDraft})}else state.procedures.push({id:Math.max(0,...state.procedures.map(x=>x.id))+1,name,price,items:window._procDraft});saveState();closeModal();render();toast('Procedimento salvo')}
function saveSettings(){state.settings={studio:document.getElementById('setStudio').value,telefone:document.getElementById('setTelefone').value,whatsapp:document.getElementById('setWhatsapp').value,instagram:document.getElementById('setInstagram').value,endereco:document.getElementById('setEndereco').value,profissional:document.getElementById('setProf').value};saveState();toast('Dados do Studio salvos')}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportProducts(){const h=['ID','Categoria','Produto','Marca','Fornecedor','Preço de compra','Rendimento','Custo por utilização','Estoque atual','Estoque mínimo','Validade','Observações'];const rows=state.products.map(p=>[p.id,p.categoria,p.produto,p.marca,p.fornecedor,p.precoCompra,p.rendimento,p.custoUso,p.estoqueAtual??'',p.estoqueMinimo??'',p.validade||p.validadeOriginal,p.observacoes]);const blob=new Blob(['\ufeff'+[h,...rows].map(r=>r.map(csvCell).join(';')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='studio_gestao_produtos.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV exportado')}
function resetProducts(){if(!confirm('Restaurar os produtos para a base original da planilha? Procedimentos, clientes e atendimentos serão preservados.'))return;state.products=SEED_PRODUCTS.map(p=>({...p,historico:[]}));saveState();render();toast('Produtos restaurados')}
function setupSearch(){const inp=document.getElementById('globalSearch'),out=document.getElementById('globalResults');inp.addEventListener('input',()=>{const q=slug(inp.value);if(q.length<2){out.classList.add('hidden');return}const ps=state.products.filter(p=>slug(p.produto).includes(q)).slice(0,6),prs=state.procedures.filter(p=>slug(p.name).includes(q)).slice(0,4),cls=state.clients.filter(c=>slug(c.nome).includes(q)).slice(0,4);out.innerHTML=[...ps.map(p=>`<div class="search-result" onclick="go('estoque');setTimeout(()=>openProduct(${p.id}),20)"><strong>${esc(p.produto)}</strong><small>Produto · ${esc(p.categoria)}</small></div>`),...prs.map(p=>`<div class="search-result" onclick="go('procedimentos')"><strong>${esc(p.name)}</strong><small>Procedimento</small></div>`),...cls.map(c=>`<div class="search-result" onclick="go('clientes');setTimeout(()=>openClient(${c.id}),20)"><strong>${esc(c.nome)}</strong><small>Cliente</small></div>`)].join('')||'<div class="search-result"><small>Nenhum resultado</small></div>';out.classList.remove('hidden')});document.addEventListener('click',e=>{if(!e.target.closest('.global-search')&&!e.target.closest('.global-results'))out.classList.add('hidden')})}
window.openClientForm=openClientForm;window.saveClient=saveClient;window.openClient=openClient;window.openAppointmentForm=openAppointmentForm;window.syncAppointmentPrice=syncAppointmentPrice;window.saveAppointment=saveAppointment;window.exportAppointments=exportAppointments;window.exportClients=exportClients;window.exportFinance=exportFinance;window.closeModal=closeModal;window.go=go;window.openProduct=openProduct;window.openProductForm=openProductForm;window.saveProduct=saveProduct;window.moveStock=moveStock;window.saveMovement=saveMovement;window.editValidity=editValidity;window.saveValidity=saveValidity;window.openProcedureForm=openProcedureForm;window.addProcItem=addProcItem;window.updProc=updProc;window.delProc=delProc;window.saveProcedure=saveProcedure;window.saveSettings=saveSettings;window.exportProducts=exportProducts;window.resetProducts=resetProducts;
setupSearch();render();

</script>
</body>
