<script>
const CHAVE_PACIENTES = "studioGestao_pacientes";

function carregarPacientes() {
    try {
        const dadosSalvos = localStorage.getItem(CHAVE_PACIENTES);

        if (!dadosSalvos) {
            return [];
        }

        const pacientesSalvos = JSON.parse(dadosSalvos);
        return Array.isArray(pacientesSalvos) ? pacientesSalvos : [];
    } catch (erro) {
        console.error("Erro ao carregar pacientes:", erro);
        return [];
    }
}

let pacientes = carregarPacientes();

function salvarPacientes() {
    try {
        localStorage.setItem(
            CHAVE_PACIENTES,
            JSON.stringify(pacientes)
        );
        return true;
    } catch (erro) {
        console.error("Erro ao salvar pacientes:", erro);
        alert("Não foi possível salvar os pacientes neste dispositivo.");
        return false;
    }
}

function adicionarPaciente(nome, telefone = "", observacoes = "") {
    const nomeLimpo = String(nome).trim();

    if (!nomeLimpo) {
        alert("Informe o nome do paciente.");
        return false;
    }

    const novoPaciente = {
        id: criarIdPaciente(),
        nome: nomeLimpo,
        telefone: String(telefone).trim(),
        observacoes: String(observacoes).trim(),
        criadoEm: new Date().toISOString()
    };

    pacientes.push(novoPaciente);

    if (!salvarPacientes()) {
        pacientes.pop();
        return false;
    }

    renderizarPacientes();
    return true;
}

function editarPaciente(id, novosDados) {
    const indice = pacientes.findIndex(
        paciente => String(paciente.id) === String(id)
    );

    if (indice === -1) {
        return false;
    }

    const pacienteAnterior = { ...pacientes[indice] };

    pacientes[indice] = {
        ...pacientes[indice],
        ...novosDados,
        id: pacientes[indice].id,
        atualizadoEm: new Date().toISOString()
    };

    if (!salvarPacientes()) {
        pacientes[indice] = pacienteAnterior;
        return false;
    }

    renderizarPacientes();
    return true;
}

function excluirPaciente(id) {
    const listaAnterior = [...pacientes];

    pacientes = pacientes.filter(
        paciente => String(paciente.id) !== String(id)
    );

    if (!salvarPacientes()) {
        pacientes = listaAnterior;
        return false;
    }

    renderizarPacientes();
    return true;
}

function criarIdPaciente() {
    if (
        typeof crypto !== "undefined" &&
        typeof crypto.randomUUID === "function"
    ) {
        return crypto.randomUUID();
    }

    return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

/*
 * Mantenha aqui a função que seu aplicativo já utiliza
 * para desenhar a lista de pacientes na tela.
 */
function renderizarPacientes() {
    const lista = document.getElementById("listaPacientes");

    if (!lista) {
        return;
    }

    lista.innerHTML = "";

    pacientes.forEach(paciente => {
        const item = document.createElement("div");
        item.className = "paciente-item";

        const nome = document.createElement("strong");
        nome.textContent = paciente.nome;

        const telefone = document.createElement("span");
        telefone.textContent = paciente.telefone
            ? ` - ${paciente.telefone}`
            : "";

        const excluir = document.createElement("button");
        excluir.type = "button";
        excluir.textContent = "Excluir";
        excluir.addEventListener("click", () => {
            if (confirm(`Excluir ${paciente.nome}?`)) {
                excluirPaciente(paciente.id);
            }
        });

        item.append(nome, telefone, excluir);
        lista.appendChild(item);
    });
}

document.addEventListener("DOMContentLoaded", () => {
    pacientes = carregarPacientes();
    renderizarPacientes();

    const formulario = document.getElementById("formPaciente");

    if (!formulario) {
        return;
    }

    formulario.addEventListener("submit", evento => {
        evento.preventDefault();

        const nome = document.getElementById("nomePaciente")?.value ?? "";
        const telefone =
            document.getElementById("telefonePaciente")?.value ?? "";
        const observacoes =
            document.getElementById("observacoesPaciente")?.value ?? "";

        if (adicionarPaciente(nome, telefone, observacoes)) {
            formulario.reset();
        }
    });
});
</script>
